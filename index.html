<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커미션 상세페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #F4F5F9;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .outer-frame {
            width: 100%;
            max-width: 820px;
            background-color: #E8EBFD;
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(160, 165, 220, 0.2);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .header-group {
            text-align: center;
            margin-bottom: 18px;
        }

        .badge-title {
            display: inline-block;
            background-color: #A3A8F5;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 700;
            padding: 6px 22px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .price-text {
            font-size: 15px;
            color: #4A4A4A;
            font-weight: 600;
        }

        .sub-info {
            font-size: 12.5px;
            color: #777;
            margin-top: 4px;
        }

        .grid-10 {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
        }

        .sample-box {
            aspect-ratio: 1 / 1;
            background-color: #F8F9FA;
            border-radius: 6px;
            border: 1px dashed #D1D5DB;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .sample-box:hover {
            transform: scale(1.05);
        }

        .sample-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .more-content {
            display: none;
            margin-top: 5px;
        }

        .more-content.show {
            display: grid;
        }

        .btn-more {
            display: block;
            width: 100%;
            max-width: 160px;
            margin: 16px auto 0 auto;
            padding: 8px 0;
            background-color: #F0F2FF;
            color: #6C72E8;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-more:hover {
            background-color: #E2E6FF;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
            cursor: pointer;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            object-fit: contain;
            animation: zoomIn 0.2s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            .outer-frame {
                padding: 16px 12px;
                border-radius: 20px;
            }
            .grid-10 {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>

<div id="imgModal" class="modal" onclick="closeModal()">
    <img id="modalImg" class="modal-content" src="" alt="확대 이미지">
</div>

<script>
    function toggleMore(id, btn) {
        const target = document.getElementById(id);
        if (target.classList.contains('show')) {
            target.classList.remove('show');
            btn.innerText = '더보기 ↓';
        } else {
            target.classList.add('show');
            btn.innerText = '접기 ↑';
        }
    }

    function openModal(element) {
        const img = element.querySelector('img');
        if (img && img.getAttribute('src')) {
            document.getElementById('modalImg').src = img.src;
            document.getElementById('imgModal').style.display = 'flex';
        }
    }

    function closeModal() {
        document.getElementById('imgModal').style.display = 'none';
    }
</script>
