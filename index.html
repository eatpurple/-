<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세페이지 샘플</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: transparent;
            padding: 60px 10px 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* 프로필 섹션 */
        .profile-card {
            width: 100%;
            background-color: #F5F3FE;
            border: 2.5px solid #9D96F4;
            border-radius: 20px;
            padding: 0 24px 22px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            margin-top: 20px;
        }

        .sparkle-profile-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin-top: -50px;
            flex-shrink: 0;
            z-index: 5;
        }

        .sparkle-ring {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 130px;
            height: 130px;
            pointer-events: none;
            animation: rotateSparkle 10s linear infinite;
            z-index: 10;
        }

        .sparkle-item {
            position: absolute;
            color: #B5ADFF;
            font-size: 14px;
            text-shadow: 0 0 6px rgba(181, 173, 255, 0.9);
            animation: twinkle 1.5s infinite alternate ease-in-out;
        }

        .sparkle-1 { top: 5px; left: 25px; animation-delay: 0s; }
        .sparkle-2 { top: 20px; right: 10px; font-size: 10px; animation-delay: 0.4s; }
        .sparkle-3 { bottom: 25px; left: 10px; font-size: 11px; animation-delay: 0.8s; }
        .sparkle-4 { bottom: 10px; right: 20px; animation-delay: 1.2s; }

        .sparkle-profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FFFFFF;
            box-shadow: 0 4px 10px rgba(157, 150, 244, 0.25);
            background-color: #FFFFFF;
            position: relative;
            z-index: 1;
        }

        @keyframes rotateSparkle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 16px;
        }

        .profile-name {
            font-size: 19px;
            font-weight: 800;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-text {
            font-size: 13.5px;
            color: #555;
            line-height: 1.55;
            word-break: keep-all;
            font-weight: 500;
        }

        /* 공지/안내 카드 */
        .line-card {
            width: 100%;
            border: 2.5px solid #9D96F4;
            border-radius: 20px;
            padding: 28px 20px 20px 20px;
            position: relative;
            background-color: #FFFFFF;
        }

        .notice-card {
            width: 100%;
            background-color: #ECEAFE;
            border-radius: 20px;
            padding: 28px 20px 20px 20px;
            position: relative;
        }

        .notice-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #9D96F4;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 800;
            padding: 5px 24px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .card-badge {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #FFFFFF;
            border: 2px solid #9D96F4;
            color: #9D96F4;
            font-size: 16px;
            font-weight: 800;
            padding: 4px 20px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .schedule-box {
            width: 100%;
            border-left: 7px double #9D96F4;
            border-right: 7px double #9D96F4;
            padding: 12px 0;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #333;
            line-height: 1.6;
            background-color: #FFFFFF;
        }

        .notice-subtext {
            text-align: center;
            font-size: 13.5px;
            color: #5247D6;
            margin-bottom: 16px;
            margin-top: 4px;
            font-weight: 700;
        }

        .form-subtext {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
            margin-top: 4px;
            font-weight: 600;
        }

        .check-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .check-item {
            background-color: #FFFFFF;
            border: 1.5px solid #C8C2FC;
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 13.5px;
            color: #333;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.4;
            font-weight: 500;
        }

        .check-item::before {
            content: '✓';
            color: #9D96F4;
            font-weight: 800;
        }

        .form-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-item {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1.5px dashed #9D96F4;
            padding-bottom: 8px;
        }

        .form-num {
            font-size: 15px;
            font-weight: 800;
            color: #9D96F4;
            min-width: 20px;
        }

        .form-input-placeholder {
            font-size: 13.5px;
            color: #555;
        }

        .process-flow {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .process-step {
            border: 1.5px solid #9D96F4;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            word-break: keep-all;
        }

        .step-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background-color: #9D96F4;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 800;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* 탭 및 레이아웃 */
        .outer-frame {
            width: 100%;
            background-color: #ECEAFE;
            border-radius: 28px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .frame-header {
            text-align: center;
            margin-bottom: 5px;
        }

        .frame-title-badge {
            display: inline-block;
            background-color: #9D96F4;
            color: #FFFFFF;
            font-size: 22px;
            font-weight: 800;
            padding: 8px 28px;
            border-radius: 24px;
        }

        .tab-container {
            display: flex;
            gap: 4px;
            padding-left: 10px;
            margin-bottom: -2px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab-btn {
            background-color: #DCD8FC;
            color: #5247D6;
            padding: 10px 18px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border: 1px solid #CECAFA;
            border-bottom: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #FFFFFF;
            color: #4A4A4A;
            font-size: 15px;
            border-color: transparent;
            position: relative;
            z-index: 2;
        }

        .tab-content-wrapper {
            background-color: #FFFFFF;
            border-radius: 18px;
            border-top-left-radius: 0px;
            padding: 24px 18px;
            position: relative;
            z-index: 1;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .header-group {
            text-align: center;
            margin-bottom: 18px;
        }

        .price-text {
            font-size: 16px;
            color: #333;
            font-weight: 700;
        }

        /* 샘플 이미지 그리드 */
        .grid-responsive {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        .sample-box {
            aspect-ratio: 1 / 1;
            background-color: #F8F9FA;
            border-radius: 6px;
            border: 1px dashed #D1D5DB;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .sample-box:hover {
            transform: scale(1.05);
        }

        .sample-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 더보기 기능 */
        .more-content {
            display: none;
            margin-top: 6px;
        }

        .more-content.show {
            display: grid;
        }

        .btn-more {
            display: block;
            width: 100%;
            max-width: 160px;
            margin: 16px auto 0 auto;
            padding: 8px 0;
            background-color: #EEECFE;
            color: #6056E0;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-more:hover {
            background-color: #E2DFFD;
        }

        /* 이미지 클릭 시 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 999999;
            backdrop-filter: blur(3px);
            cursor: pointer;
        }

        .modal-container {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90vw;
            max-height: 85vh;
            pointer-events: none;
        }

        .modal-content {
            width: 100%;
            height: 100%;
            max-width: 85vw;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            animation: zoomIn 0.15s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .grid-responsive { grid-template-columns: repeat(8, 1fr); }
        }

        @media (max-width: 500px) {
            .profile-card { flex-direction: column; text-align: center; padding-top: 0; }
            .sparkle-profile-wrapper { margin-top: -50px; }
            .profile-info { padding-top: 0; }
            .profile-name { justify-content: center; }
            .outer-frame { padding: 16px 10px; border-radius: 20px; }
            .grid-responsive { grid-template-columns: repeat(5, 1fr); gap: 4px; }
            .tab-btn { padding: 8px 12px; font-size: 13px; }
            .process-flow { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="sparkle-profile-wrapper">
            <div class="sparkle-ring">
                <span class="sparkle-item sparkle-1">✦</span>
                <span class="sparkle-item sparkle-2">✧</span>
                <span class="sparkle-item sparkle-3">✦</span>
                <span class="sparkle-item sparkle-4">✧</span>
            </div>
            <img src="profile.png" alt="프로필" class="sparkle-profile-img" onerror="this.src='https://via.placeholder.com/100'">
        </div>
        <div class="profile-info">
            <div class="profile-name">작가 닉네임 ✦</div>
            <div class="profile-text">
                안녕하세요! 귀여운 감성을 담아내는 작가입니다.<br>
                원하시는 느낌으로 최선을 다해 작업해 드립니다.
            </div>
        </div>
    </div>

    <div class="schedule-box">
        주문 예약 진행 중입니다!
    </div>

    <div class="notice-card">
        <div class="notice-badge">✦ 공지사항 ✦</div>
        <div class="notice-subtext">아래 사항을 숙지하지 않아 생기는 불이익은 책임지지 않습니다.</div>
        <ul class="check-list">
            <li class="check-item">작업물의 저작권은 작가에게 있으며, 2차가공은 불가합니다.</li>
            <li class="check-item">기본 작업 기간은 입금 확인일로부터 최대 OO일 소요됩니다.</li>
            <li class="check-item">완성본은 PNG(또는 GIF) 파일 형태로 발송됩니다.</li>
        </ul>
    </div>

    <div class="line-card">
        <div class="card-badge">신청양식</div>
        <div class="form-subtext">복사하셔서 작성해주세요!</div>
        <div class="form-list">
            <div class="form-item"><span class="form-num">1.</span><span class="form-input-placeholder">닉네임 / 입금자명 :</span></div>
            <div class="form-item"><span class="form
