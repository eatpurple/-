<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커미션 상세페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #969AF3;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* 공통 카드 스타일 */
        .card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        /* 타이틀 & 가격 헤더 */
        .header-group {
            text-align: center;
            margin-bottom: 18px;
        }

        .badge-title {
            display: inline-block;
            background-color: #969AF3;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .price-text {
            font-size: 15px;
            color: #4A4A4A;
            font-weight: 600;
        }

        .sub-info {
            font-size: 12.5px;
            color: #777;
            margin-top: 4px;
        }

        /* 9열 그리드 시스템 */
        .grid-9 {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
        }

        .sample-box {
            aspect-ratio: 1 / 1;
            background-color: #F3F4F6;
            border-radius: 6px;
            border: 1px dashed #D1D5DB;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sample-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 더보기 접기/펴기 연출 */
        .more-content {
            display: none;
            margin-top: 6px;
        }

        .more-content.show {
            display: grid;
        }

        .btn-more {
            display: block;
            width: 100%;
            max-width: 160px;
            margin: 16px auto 0 auto;
            padding: 8px 0;
            background-color: #F0F1FF;
            color: #5A60E8;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-more:hover {
            background-color: #E2E4FF;
        }

        /* 모바일 대응 (화면 폭이 좁아질 때 가독성 확보) */
        @media (max-width: 600px) {
            .grid-9 {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. 글자티콘 -->
    <div class="card">
        <div class="header-group">
            <div class="badge-title">글자티콘</div>
            <div class="price-text">개당 0.7</div>
        </div>
        <div class="grid-9">
            <!-- 1~9번 기본 샘플 이미지 위치 -->
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <div class="grid-9 more-content" id="more-texticon">
            <!-- 더보기 클릭 시 열리는 추가 샘플 위치 -->
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <button class="btn-more" onclick="toggleMore('more-texticon', this)">더보기 ↓</button>
    </div>

    <!-- 2. 구독티콘 -->
    <div class="card">
        <div class="header-group">
            <div class="badge-title">구독티콘</div>
            <div class="price-text">개당 1.5</div>
        </div>
        <div class="grid-9">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <div class="grid-9 more-content" id="more-subicon">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <button class="btn-more" onclick="toggleMore('more-subicon', this)">더보기 ↓</button>
    </div>

    <!-- 3. 움짤티콘 -->
    <div class="card">
        <div class="header-group">
            <div class="badge-title">움짤티콘</div>
            <div class="price-text" style="margin-top: 8px;">[미니 모션] 개당 2.5</div>
            <div class="sub-info">프레임 제한 / 소모션 및 부분 변형 등</div>
        </div>
        <div class="grid-9" style="margin-bottom: 20px;">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>

        <div class="header-group" style="border-top: 1px dashed #E5E7EB; padding-top: 16px;">
            <div class="price-text">[기본] 개당 3.5</div>
        </div>
        <div class="grid-9">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <div class="grid-9 more-content" id="more-gificon">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <button class="btn-more" onclick="toggleMore('more-gificon', this)">더보기 ↓</button>
    </div>

    <!-- 4. 뱃지 -->
    <div class="card">
        <div class="header-group">
            <div class="badge-title">뱃지</div>
            <div class="price-text">개당 1.0</div>
            <div class="sub-info">소품 변경: +0.7 | 색상 변경: +0.5</div>
        </div>
        <div class="grid-9">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <div class="grid-9 more-content" id="more-badge">
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
            <div class="sample-box"></div><div class="sample-box"></div><div class="sample-box"></div>
        </div>
        <button class="btn-more" onclick="toggleMore('more-badge', this)">더보기 ↓</button>
    </div>

</div>

<script>
    function toggleMore(id, btn) {
        const target = document.getElementById(id);
        if (target.classList.contains('show')) {
            target.classList.remove('show');
            btn.innerText = '더보기 ↓';
        } else {
            target.classList.add('show');
            btn.innerText = '접기 ↑';
        }
    }
</script>

</body>
</html>
