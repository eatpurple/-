<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커미션 상세페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: transparent;
            padding: 10px 5px;
            display: flex;
            justify-content: center;
            position: relative; /* 상대 위치 기준점 */
        }

        .outer-frame {
            width: 100%;
            max-width: 900px;
            background-color: #E8EBFD;
            border-radius: 28px;
            padding: 25px 15px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 18px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .header-group {
            text-align: center;
            margin-bottom: 18px;
        }

        .badge-title {
            display: inline-block;
            background-color: #A3A8F5;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 700;
            padding: 6px 22px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .price-text {
            font-size: 15px;
            color: #4A4A4A;
            font-weight: 600;
        }

        .sub-info {
            font-size: 12.5px;
            color: #777;
            margin-top: 4px;
        }

        .grid-responsive {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        .sample-box {
            aspect-ratio: 1 / 1;
            background-color: #F8F9FA;
            border-radius: 6px;
            border: 1px dashed #D1D5DB;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .sample-box:hover {
            transform: scale(1.05);
        }

        .sample-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .more-content {
            display: none;
            margin-top: 6px;
        }

        .more-content.show {
            display: grid;
        }

        .btn-more {
            display: block;
            width: 100%;
            max-width: 160px;
            margin: 16px auto 0 auto;
            padding: 8px 0;
            background-color: #F0F2FF;
            color: #6C72E8;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-more:hover {
            background-color: #E2E6FF;
        }

        /* 절대 위치 기반 모달 팝업 */
        .modal {
            display: none;
            position: absolute;
            z-index: 99999;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .modal-content {
            max-width: 85vw;
            max-height: 70vh;
            border-radius: 8px;
            object-fit: contain;
            display: block;
            animation: zoomIn 0.15s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .grid-responsive {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        @media (max-width: 500px) {
            .outer-frame {
                padding: 16px 10px;
                border-radius: 20px;
            }
            .grid-responsive {
                grid-template-columns: repeat(5, 1fr);
                gap: 4px;
            }
        }
    </style>
</head>

<!-- 클릭 위치 기반 확대 모달 -->
<div id="imgModal" class="modal" onclick="closeModal()">
    <img id="modalImg" class="modal-content" src="" alt="확대 이미지">
</div>

<script>
    function toggleMore(id, btn) {
        const target = document.getElementById(id);
        if (target.classList.contains('show')) {
            target.classList.remove('show');
            btn.innerText = '더보기 ↓';
        } else {
            target.classList.add('show');
            btn.innerText = '접기 ↑';
        }
    }

    function openModal(element) {
        const img = element.querySelector('img');
        if (img && img.getAttribute('src')) {
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            
            modalImg.src = img.src;

            // 클릭된 박스의 절대 Y 위치 계산
            const rect = element.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const clickY = rect.top + scrollTop + (rect.height / 2);

            // 해당 위치로 모달 이동 및 표시
            modal.style.top = clickY + 'px';
            modal.style.display = 'block';
        }
    }

    function closeModal() {
        document.getElementById('imgModal').style.display = 'none';
    }
</script>
