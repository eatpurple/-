<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커미션 상세페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        /* 바깥 바탕 (뒷배경 투명 처리 및 여백 최소화) */
        body {
            background-color: transparent; /* 뒤쪽 배경색 제거 */
            padding: 10px 5px;
            display: flex;
            justify-content: center;
        }

        /* 메인 연보라 프레임 */
        .outer-frame {
            width: 100%;
            max-width: 900px;
            background-color: #E8EBFD;
            border-radius: 28px;
            padding: 25px 15px;
            box-shadow: 0 8px 25px rgba(160, 165, 220, 0.15);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 18px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .header-group {
            text-align: center;
            margin-bottom: 18px;
        }

        .badge-title {
            display: inline-block;
            background-color: #A3A8F5;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 700;
            padding: 6px 22px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .price-text {
            font-size: 15px;
            color: #4A4A4A;
            font-weight: 600;
        }

        .sub-info {
            font-size: 12.5px;
            color: #777;
            margin-top: 4px;
        }

        /* 반응형 그리드 */
        .grid-responsive {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        .sample-box {
            aspect-ratio: 1 / 1;
            background-color: #F8F9FA;
            border-radius: 6px;
            border: 1px dashed #D1D5DB;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .sample-box:hover {
            transform: scale(1.05);
        }

        .sample-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .more-content {
            display: none;
            margin-top: 6px;
        }

        .more-content.show {
            display: grid;
        }

        .btn-more {
            display: block;
            width: 100%;
            max-width: 160px;
            margin: 16px auto 0 auto;
            padding: 8px 0;
            background-color: #F0F2FF;
            color: #6C72E8;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-more:hover {
            background-color: #E2E6FF;
        }

        /* 현재 화면 위치(뷰포트) 기준 확대 팝업 */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            animation: zoomIn 0.15s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 반응형 가로 조절 */
        @media (max-width: 768px) {
            .grid-responsive {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        @media (max-width: 500px) {
            .outer-frame {
                padding: 16px 10px;
                border-radius: 20px;
            }
            .grid-responsive {
                grid-template-columns: repeat(5, 1fr);
                gap: 4px;
            }
        }
    </style>
</head>
<body>
