<script>
    const username = 'eatpurple';
    const repo = 'eatpurple';
    const branch = 'main';

    const config = {
        defaultShowCount: 10,
        items: [
            /* 1단락 */
            { mainId: 'grid-texticon-main', moreId: 'more-texticon', btnId: 'btn-texticon', path: 'img/texticon', filterExt: 'png' },
            { mainId: 'grid-texticon-gif-main', moreId: 'more-texticon-gif', btnId: 'btn-texticon-gif', path: 'img/texticon', filterExt: 'gif' },
            { mainId: 'grid-subicon-main', moreId: 'more-subicon', btnId: 'btn-subicon', path: 'img/subicon' },
            { mainId: 'grid-gificon-main', moreId: 'more-gificon', btnId: 'btn-gificon', path: 'img/gifcon' },
            { mainId: 'grid-badge-main', moreId: 'more-badge', btnId: 'btn-badge', path: 'img/badge' },
            { mainId: 'grid-ogq-main', moreId: 'more-ogq', btnId: 'btn-ogq', path: 'img/ogq' },
            
            /* 2단락 */
            { mainId: 'grid-screen-main', moreId: 'more-screen', btnId: 'btn-screen', path: 'img/screen' },
            { mainId: 'grid-topbanner-main', moreId: 'more-topbanner', btnId: 'btn-topbanner', path: 'img/topbanner' },
            { mainId: 'grid-botbanner-main', moreId: 'more-botbanner', btnId: 'btn-botbanner', path: 'img/botbanner' },
            
            /* 3단락 */
            { mainId: 'grid-balloon-main', moreId: 'more-balloon', btnId: 'btn-balloon', path: 'img/balloon' },
            { mainId: 'grid-gifanim-main', moreId: 'more-gifanim', btnId: 'btn-gifanim', path: 'img/gifanim' },
            { mainId: 'grid-ziptok-main', moreId: 'more-ziptok', btnId: 'btn-ziptok', path: 'img/ziptok' },
            { mainId: 'grid-avatar-main', moreId: 'more-avatar', btnId: 'btn-avatar', path: 'img/avatar' }
        ]
    };

    const folderCache = {};

    async function fetchAndRenderImages() {
        for (const item of config.items) {
            const mainContainer = document.getElementById(item.mainId);
            const moreContainer = document.getElementById(item.moreId);
            const btnMore = document.getElementById(item.btnId);

            if (!mainContainer) continue;

            try {
                if (!folderCache[item.path]) {
                    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${item.path}?ref=${branch}`;
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        folderCache[item.path] = await response.json();
                    } else {
                        folderCache[item.path] = [];
                    }
                }

                const files = folderCache[item.path];
                
                // 이미지 파일 필터링
                let imageFiles = files.filter(file => 
                    /\.(png|jpe?g|gif|webp)$/i.test(file.name)
                );

                // 글자티콘 확장자별 분리 (PNG / GIF)
                if (item.filterExt) {
                    imageFiles = imageFiles.filter(file => 
                        file.name.toLowerCase().endsWith('.' + item.filterExt)
                    );
                }

                if (imageFiles.length <= config.defaultShowCount && btnMore) {
                    btnMore.style.display = 'none';
                }

                imageFiles.forEach((file, index) => {
                    const targetContainer = (index < config.defaultShowCount) ? mainContainer : moreContainer;

                    const box = document.createElement('div');
                    box.className = 'sample-box';
                    box.onclick = function() { openModal(this); };

                    const img = document.createElement('img');
                    img.src = `https://raw.githubusercontent.com/${username}/${repo}/${branch}/${item.path}/${file.name}`;
                    img.alt = file.name;

                    box.appendChild(img);
                    targetContainer.appendChild(box);
                });

            } catch (error) {
                console.error(`폴더 로드 실패 (${item.path}):`, error);
                if (btnMore) btnMore.style.display = 'none';
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fetchAndRenderImages);
    } else {
        fetchAndRenderImages();
    }

    // 탭 전환
    function switchTab(groupId, contentId, index) {
        const tabContainer = document.getElementById(groupId);
        const buttons = tabContainer.querySelectorAll('.tab-btn');
        const contentWrapper = document.getElementById(contentId);
        const panels = contentWrapper.querySelectorAll('.tab-panel');

        buttons.forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('active');
                panels[i].classList.add('active');
            } else {
                btn.classList.remove('active');
                panels[i].classList.remove('active');
            }
        });
    }

    // 더보기 토글
    function toggleMore(id, btn) {
        const target = document.getElementById(id);
        if (target.classList.contains('show')) {
            target.classList.remove('show');
            btn.innerText = '더보기 ↓';
        } else {
            target.classList.add('show');
            btn.innerText = '접기 ↑';
        }
    }

    // 모달 기능 (사진 클릭 시 확대)
    function openModal(element) {
        const img = element.querySelector('img');
        if (img && img.getAttribute('src')) {
            const modal = document.getElementById('imgModal');
            const modalContainer = document.getElementById('modalContainer');
            const modalImg = document.getElementById('modalImg');
            
            modalImg.src = img.src;

            const rect = element.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const clickY = rect.top + scrollTop + (rect.height / 2);

            modalContainer.style.top = clickY + 'px';
            modal.style.display = 'block';
        }
    }

    function closeModal() {
        document.getElementById('imgModal').style.display = 'none';
    }
</script>
